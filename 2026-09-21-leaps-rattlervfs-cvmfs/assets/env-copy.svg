<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Today: every environment is a full copy of the package cache</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Lato:wght@400;700&amp;display=swap");
svg { font-family: Lato, "Fira Sans", "Segoe UI", Helvetica, sans-serif; }
text { fill: #441a84 }
.box   { fill: #ffffff; stroke: #441a84; stroke-width: 2 }
.title { font-size: 18px; font-weight: 700 }
.sub   { font-size: 12.5px; fill: #6d727f }
.chip  { fill: #f7e4a8; stroke: #d2a62a; stroke-width: 1.5 }
.chipt { font-size: 15px; text-anchor: middle }
.chips { font-size: 11px; fill: #7a6a3a; text-anchor: middle }
.flow  { font-size: 15px; font-weight: 700; text-anchor: middle }
.cap   { font-size: 16.5px; fill: #6d727f; text-anchor: middle }
.arrow { fill: none; stroke: #ecc444; stroke-width: 6; stroke-linecap: round }
</style>

<defs>
  <marker id="head" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5" markerHeight="5" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#ecc444"/>
  </marker>
</defs>

<!-- package cache -->
<rect class="box" x="30" y="55" width="250" height="302" rx="10"/>
<text class="title" x="48" y="92">Package cache</text>
<text class="sub"   x="48" y="112">downloaded and extracted once</text>
<g>
  <rect class="chip" x="48" y="128" width="214" height="44" rx="6"/><text class="chipt" x="155" y="156">python</text>
  <rect class="chip" x="48" y="180" width="214" height="44" rx="6"/><text class="chipt" x="155" y="208">numpy</text>
  <rect class="chip" x="48" y="232" width="214" height="44" rx="6"/><text class="chipt" x="155" y="260">hdf5</text>
  <rect class="chip" x="48" y="284" width="214" height="44" rx="6"/><text class="chipt" x="155" y="312">silx</text>
</g>

<!-- copy arrows -->
<text class="flow" x="380" y="30">copy every file,</text>
<text class="flow" x="380" y="48">then fix paths and shebangs</text>
<path class="arrow" marker-end="url(#head)" d="M 292 200 C 370 200, 390 96, 466 96"/>
<path class="arrow" marker-end="url(#head)" d="M 292 206 L 466 206"/>
<path class="arrow" marker-end="url(#head)" d="M 292 212 C 370 212, 390 316, 466 316"/>

<!-- environment A -->
<rect class="box" x="480" y="55" width="700" height="82" rx="10"/>
<text class="title" x="498" y="90">Environment A</text>
<text class="sub"   x="498" y="111">a full copy</text>
<rect class="chip" x="660"  y="74" width="150" height="44" rx="6"/><text class="chipt" x="735"  y="102">python</text>
<rect class="chip" x="835"  y="74" width="150" height="44" rx="6"/><text class="chipt" x="910"  y="102">numpy</text>
<rect class="chip" x="1010" y="74" width="150" height="44" rx="6"/><text class="chipt" x="1085" y="102">hdf5</text>

<!-- environment B -->
<rect class="box" x="480" y="165" width="700" height="82" rx="10"/>
<text class="title" x="498" y="200">Environment B</text>
<text class="sub"   x="498" y="221">a full copy</text>
<rect class="chip" x="660"  y="184" width="150" height="44" rx="6"/><text class="chipt" x="735"  y="212">python</text>
<rect class="chip" x="835"  y="184" width="150" height="44" rx="6"/><text class="chipt" x="910"  y="212">numpy</text>
<rect class="chip" x="1010" y="184" width="150" height="44" rx="6"/><text class="chipt" x="1085" y="212">hdf5</text>

<!-- environment C: one extra package -->
<rect class="box" x="480" y="275" width="700" height="82" rx="10"/>
<text class="title" x="498" y="310">Environment C</text>
<text class="sub"   x="498" y="331">a full copy, plus one</text>
<rect class="chip" x="660"  y="294" width="118" height="44" rx="6"/><text class="chipt" x="719"  y="322">python</text>
<rect class="chip" x="787"  y="294" width="118" height="44" rx="6"/><text class="chipt" x="846"  y="322">numpy</text>
<rect class="chip" x="914"  y="294" width="118" height="44" rx="6"/><text class="chipt" x="973"  y="322">hdf5</text>
<rect class="chip" x="1041" y="294" width="118" height="44" rx="6" stroke="#441a84" stroke-width="2.5"/>
<text class="chipt" x="1100" y="316">silx</text><text class="chips" x="1100" y="331">your build</text>

<text class="cap" x="600" y="400">The same bytes written out again for every environment. One extra package costs a whole new copy.</text>
</svg>
