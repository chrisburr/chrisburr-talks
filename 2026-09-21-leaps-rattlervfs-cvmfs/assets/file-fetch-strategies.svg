<line class="span" x1="300" y1="364" x2="552.0" y2="364"/><line class="span" x1="300" y1="359" x2="300" y2="369"/><line class="span" x1="552.0" y1="359" x2="552.0" y2="369"/><text class="spanT" x="300" y="384">the same latency, paid three times instead of twelve</text>
<text class="note" x="388.0" y="302">a bundle arrives at full link speed</text>
<text class="note" x="856.0" y="302">and the job gets four times as far before the next stall</text>
<path class="idle" d="M380 412 h36"/><text class="leg" x="426" y="417">link idle</text>
<rect class="blk" x="530" y="404" width="36" height="16" rx="3"/><text class="leg" x="576" y="417">bytes arriving</text>
<rect class="run" x="710" y="404" width="36" height="16" rx="3"/><text class="leg" x="756" y="417">job running</text>
<text class="cap" x="600" y="458">Height is the share of the link in use. The job amortises its startup, but every job pays it again.</text>
</svg>