<line class="span" x1="300" y1="244" x2="960.0" y2="244"/><line class="span" x1="300" y1="239" x2="300" y2="249"/><line class="span" x1="960.0" y1="239" x2="960.0" y2="249"/><text class="spanT" x="300" y="264">it barely gets going before the next file stops it</text>
<text class="mono" x="343.0" y="182">numpy/__init__.py</text>
<text class="note" x="760.0" y="182">one small file never comes close to filling the link</text>
<text class="title" x="30" y="340">Fetch bundles</text><text class="sub" x="30" y="360">runs at once, and gets further each time</text>
