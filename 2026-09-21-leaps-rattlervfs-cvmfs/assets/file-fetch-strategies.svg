<text class="note" x="372.0" y="62">opened</text>
<text class="note" x="612.0" y="62">never opened</text>
<text class="note" x="834.0" y="62">extract</text>
<rect fill="url(#fade)" x="864.0" y="74" width="296.0" height="36" rx="3"/>
<line class="span" x1="300" y1="124" x2="864.0" y2="124"/><line class="span" x1="300" y1="119" x2="300" y2="129"/><line class="span" x1="864.0" y1="119" x2="864.0" y2="129"/><text class="spanT" x="300" y="144">the job cannot start at all until the end of this</text>
<text x="878.0" y="97" font-size="13" fill="#ffffff">the job, running for hours</text>
<text class="note" x="1160" y="68" style="text-anchor:end">link speed</text>
