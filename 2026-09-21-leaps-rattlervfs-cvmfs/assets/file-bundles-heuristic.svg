<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">How the bundle generator picks files: parse the trigger file, walk the AST, resolve inside the package</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Lato:wght@400;700&amp;display=swap");
svg { font-family: Lato, "Fira Sans", "Segoe UI", Helvetica, sans-serif; }
text { fill: #441a84 }
.box    { fill: #ffffff; stroke: #441a84; stroke-width: 2 }
.ptitle { font-size: 13px; font-weight: 700; font-family: ui-monospace, "DejaVu Sans Mono", monospace }
.psub   { font-size: 11px; fill: #6d727f }
.code   { font-size: 12.5px; font-family: ui-monospace, "DejaVu Sans Mono", monospace; fill: #441a84 }
.flow   { font-size: 14px; font-weight: 700; text-anchor: middle }
.cap    { font-size: 16.5px; fill: #6d727f; text-anchor: middle }
.arrow  { fill: none; stroke: #441a84; stroke-width: 2.5; stroke-dasharray: 7 5; stroke-linecap: round }
.edge   { fill: none; stroke: #b9a7d6; stroke-width: 1.5 }
.nt     { font-size: 11px; font-weight: 700 }
.nc     { font-size: 11.5px; font-family: ui-monospace, "DejaVu Sans Mono", monospace }
.ann    { font-size: 10.5px; fill: #6d727f }
.keep   { fill: #f7e4a8; stroke: #d2a62a; stroke-width: 1.5 }
.plain  { fill: #ffffff; stroke: #b9a7d6; stroke-width: 1.5 }
.skip   { fill: #f2f2f5; stroke: #c9c9d4; stroke-width: 1.5 }
.other  { fill: #ffffff; stroke: #441a84; stroke-width: 1.5; stroke-dasharray: 4 4 }
.fill   { fill: #fdf8e8; stroke: #e0c88a; stroke-width: 1.5 }
</style>
<defs><marker id="head" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto">
<path d="M0,0 L12,6 L0,12 z" fill="#441a84"/></marker></defs>
<rect class="box" x="30" y="55" width="290" height="280" rx="10"/>
<text class="ptitle" x="46" y="82">numpy/__init__.py</text>
<text class="psub" x="46" y="100">the trigger: opening it fires the bundle</text>
<text class="code" x="46" y="136">from . import core</text>
<text class="code" x="46" y="162">from .lib import mixins</text>
<text class="code" x="46" y="188">import numpy.linalg</text>
<text class="code" x="46" y="214"></text>
<text class="code" x="46" y="240">import os</text>
<text class="code" x="46" y="266">from scipy import sparse</text>
<text class="flow" x="355" y="44">parse with ruff</text>
<path class="arrow" marker-end="url(#head)" d="M 326 195 L 384 195"/>
<rect class="box" x="390" y="55" width="410" height="280" rx="10"/>
<text class="ptitle" x="406" y="82">AST</text>
<text class="psub" x="406" y="100">every import the module will make</text>
<rect class="plain" x="410" y="112" width="112" height="28" rx="5"/>
<text class="nt" x="424" y="131">Module</text>
<path class="edge" d="M424 140 V 312"/>
<path class="edge" d="M424 168 H 450"/>
<rect class="keep" x="450" y="154" width="230" height="28" rx="5"/>
<text class="nt" x="462" y="173">ImportFrom</text>
<text class="nc" x="540" y="173">.core</text>
<path class="edge" d="M424 204 H 450"/>
<rect class="keep" x="450" y="190" width="230" height="28" rx="5"/>
<text class="nt" x="462" y="209">ImportFrom</text>
<text class="nc" x="540" y="209">.lib.mixins</text>
<path class="edge" d="M424 240 H 450"/>
<rect class="keep" x="450" y="226" width="230" height="28" rx="5"/>
<text class="nt" x="462" y="245">Import</text>
<text class="nc" x="540" y="245">numpy.linalg</text>
<path class="edge" d="M424 276 H 450"/>
<rect class="skip" x="450" y="262" width="230" height="28" rx="5"/>
<text class="nt" x="462" y="281" fill="#9aa0ad">Import</text>
<text class="nc" x="540" y="281" fill="#9aa0ad">os</text>
<text class="ann" x="690" y="281">stdlib, skipped</text>
<path class="edge" d="M424 312 H 450"/>
<rect class="other" x="450" y="298" width="230" height="28" rx="5"/>
<text class="nt" x="462" y="317">ImportFrom</text>
<text class="nc" x="540" y="317">scipy.sparse</text>
<text class="ann" x="690" y="317">its own trigger</text>
<text class="flow" x="835" y="44">resolve inside the package, repeat</text>
<path class="arrow" marker-end="url(#head)" d="M 806 195 L 864 195"/>
<rect class="box" x="870" y="55" width="300" height="280" rx="10"/>
<text class="ptitle" x="886" y="82">.cvmfsbundle-__init__.py</text>
<text class="psub" x="886" y="100">the transitive closure, written beside it</text>
<rect class="fill" x="886" y="112" width="268" height="176" rx="6"/>
<text class="nc" x="898" y="136">numpy/core/__init__.py</text>
<text class="nc" x="898" y="160">numpy/core/_methods.py</text>
<text class="nc" x="898" y="184">numpy/core/multiarray.so</text>
<text class="nc" x="898" y="208">numpy/lib/mixins.py</text>
<text class="nc" x="898" y="232">numpy/linalg/_umath_linalg.so</text>
<text class="nc" x="898" y="256">numpy/lib/_type_check.py</text>
<text class="nc" x="898" y="276" fill="#6d727f">… and 400 more</text>
<text class="ann" x="886" y="312" font-size="11">scipy.sparse is listed but not inlined:</text>
<text class="ann" x="886" y="328" font-size="11">it has a trigger of its own.</text>
<text class="cap" x="600" y="375">One open fetches everything the import will read, in a single parallel sweep.</text>
</svg>