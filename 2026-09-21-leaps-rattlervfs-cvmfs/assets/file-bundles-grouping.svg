<rect class="boxv" x="480" y="275" width="700" height="82" rx="10"/>
<text class="title" x="498" y="310">Left loose</text>
<text class="sub"   x="498" y="331">headers, docs, tests</text>
<g transform="translate(660,302)">
  <rect class="fv" x="0"   y="0" width="20" height="28" rx="3"/><rect class="fv" x="34" y="0" width="20" height="28" rx="3"/>
  <rect class="fv" x="68"  y="0" width="20" height="28" rx="3"/><rect class="fv" x="102" y="0" width="20" height="28" rx="3"/>
  <rect class="fv" x="136" y="0" width="20" height="28" rx="3"/><rect class="fv" x="170" y="0" width="20" height="28" rx="3"/>
</g>
<text class="sub" x="860" y="324">fetched only if something opens them</text>

<text class="cap" x="600" y="400">Static analysis works out what a cold start will actually read, and those files become one object in the repository.</text>
