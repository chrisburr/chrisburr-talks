<rect class="box" x="480" y="165" width="700" height="82" rx="10"/>
<text class="title" x="498" y="200">Bundle B</text>
<text class="sub"   x="498" y="221">numpy.linalg</text>
<rect class="f" x="660" y="192" width="260" height="28" rx="4"/>
<line class="div" x1="686" y1="192" x2="686" y2="220"/>
<line class="div" x1="712" y1="192" x2="712" y2="220"/>
<line class="div" x1="738" y1="192" x2="738" y2="220"/>
<line class="div" x1="764" y1="192" x2="764" y2="220"/>
<line class="div" x1="790" y1="192" x2="790" y2="220"/>
