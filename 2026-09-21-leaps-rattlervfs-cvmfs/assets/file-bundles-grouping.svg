<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">A bundle generator groups files that are always opened together</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Lato:wght@400;700&amp;display=swap");
svg { font-family: Lato, "Fira Sans", "Segoe UI", Helvetica, sans-serif; }
text { fill: #441a84 }
.box    { fill: #ffffff; stroke: #441a84; stroke-width: 2 }
.boxv   { fill: #ffffff; stroke: #441a84; stroke-width: 2; stroke-dasharray: 8 6 }
.title  { font-size: 18px; font-weight: 700 }
.sub    { font-size: 12.5px; fill: #6d727f }
.div    { stroke: #d2a62a; stroke-width: 1 }
.f      { fill: #f7e4a8; stroke: #d2a62a; stroke-width: 1.2 }
.fv     { fill: none; stroke: #b9a7d6; stroke-width: 1.2; stroke-dasharray: 4 4 }
.flow   { font-size: 15px; font-weight: 700; text-anchor: middle }
.cap    { font-size: 16.5px; fill: #6d727f; text-anchor: middle }
.arrow  { fill: none; stroke: #441a84; stroke-width: 2.5; stroke-dasharray: 7 5; stroke-linecap: round }
.bar    { fill: #441a84 }
.barT   { font-size: 20px; font-weight: 700; fill: #ffffff; text-anchor: middle }
.barS   { font-size: 12px; fill: #cdbce8; text-anchor: middle }
</style>

<defs>
  <marker id="head" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#441a84"/>
  </marker>
  <g id="grid">
    <rect class="f" x="0"   y="0"  width="28" height="20" rx="3"/><rect class="f" x="34"  y="0"  width="28" height="20" rx="3"/>
    <rect class="f" x="68"  y="0"  width="28" height="20" rx="3"/><rect class="f" x="102" y="0"  width="28" height="20" rx="3"/>
    <rect class="f" x="136" y="0"  width="28" height="20" rx="3"/><rect class="f" x="170" y="0"  width="28" height="20" rx="3"/>
  </g>
</defs>

<!-- the package, as files -->
<rect class="box" x="30" y="55" width="250" height="302" rx="10"/>
<text class="title" x="48" y="92">The repository</text>
<text class="sub"   x="48" y="112">every file its own object</text>
<use href="#grid" x="50" y="128"/><use href="#grid" x="50" y="154"/><use href="#grid" x="50" y="180"/><use href="#grid" x="50" y="206"/>
<use href="#grid" x="50" y="232"/><use href="#grid" x="50" y="258"/><use href="#grid" x="50" y="284"/><use href="#grid" x="50" y="310"/>

<!-- generator -->
<text class="flow" x="390" y="38">what gets opened together?</text>
<path class="arrow" marker-end="url(#head)" d="M 288 206 L 344 206"/>
<rect class="bar" x="350" y="55" width="80" height="302" rx="10"/>
<g transform="translate(390,206) rotate(-90)">
  <text class="barT" x="0" y="-6">Bundle generator</text>
  <text class="barS" x="0" y="15">Python static analysis</text>
</g>
<path class="arrow" marker-end="url(#head)" d="M 436 200 C 452 200, 452 96, 470 96"/>
<path class="arrow" marker-end="url(#head)" d="M 436 206 L 470 206"/>
<path class="arrow" marker-end="url(#head)" d="M 436 212 C 452 212, 452 316, 470 316"/>

