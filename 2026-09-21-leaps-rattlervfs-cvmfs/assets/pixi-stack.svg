<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B1B8C"/>
    </marker>
    <style>
      .band-title { font-size: 22px; font-weight: 700; fill: #4B1B8C; }
      .band-sub   { font-size: 13px; fill: #6E6488; }
      .owner      { font-size: 12px; font-style: italic; fill: #9A91B0; }
      .ws-title   { font-size: 16px; font-weight: 700; fill: #4B1B8C; }
      .ws-deps    { font-size: 13px; fill: #4B1B8C; }
      .mono       { font-family: 'Fira Mono', 'Fira Code', Menlo, monospace; font-size: 12px; fill: #6E6488; }
      .chip       { font-size: 14px; fill: #4B1B8C; text-anchor: middle; }
      .chip-sys   { font-size: 14px; fill: #55506A; text-anchor: middle; }
      .note       { font-size: 13px; font-style: italic; fill: #6E6488; }
      .flow       { font-size: 13px; font-weight: 700; fill: #4B1B8C; }
      .caption    { font-size: 19px; font-weight: 600; fill: #4A1789; text-anchor: middle; }
    </style>
  </defs>

  <!-- ============ Pixi: workspaces ============ -->
  <rect x="2" y="12" width="1096" height="140" rx="12" fill="#FFFFFF" stroke="#4B1B8C" stroke-width="2"/>
  <text x="26" y="56" class="band-title">Pixi</text>
  <text x="26" y="78" class="band-sub">one workspace per task</text>
  <text x="26" y="132" class="owner">owned by users and projects</text>

  <g>
    <rect x="250" y="30" width="262" height="104" rx="8" fill="#FFFFFF" stroke="#4B1B8C" stroke-width="1.5"/>
    <text x="268" y="60" class="ws-title">Beamline control</text>
    <text x="268" y="84" class="ws-deps">ophyd, bluesky, pytango</text>
    <text x="268" y="116" class="mono">pixi.toml + pixi.lock</text>
  </g>
  <g>
    <rect x="528" y="30" width="262" height="104" rx="8" fill="#FFFFFF" stroke="#4B1B8C" stroke-width="1.5"/>
    <text x="546" y="60" class="ws-title">Analysis</text>
    <text x="546" y="84" class="ws-deps">pyfai, silx, numpy</text>
    <text x="546" y="116" class="mono">pixi.toml + pixi.lock</text>
  </g>
  <g>
    <rect x="806" y="30" width="262" height="104" rx="8" fill="#FFFFFF" stroke="#4B1B8C" stroke-width="1.5"/>
    <text x="824" y="60" class="ws-title">Your development</text>
    <text x="824" y="84" class="ws-deps">your package + its dependencies</text>
    <text x="824" y="116" class="mono">pixi.toml + pixi.lock</text>
  </g>

  <!-- resolve & lock arrows -->
  <line x1="381" y1="136" x2="381" y2="186" stroke="#4B1B8C" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="659" y1="136" x2="659" y2="186" stroke="#4B1B8C" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="937" y1="136" x2="937" y2="186" stroke="#4B1B8C" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="393" y="174" class="flow">resolve and lock</text>

  <!-- ============ conda-forge: everything else ============ -->
  <rect x="2" y="190" width="1096" height="110" rx="12" fill="#FFFFFF" stroke="#4B1B8C" stroke-width="2"/>
  <text x="26" y="232" class="band-title">conda-forge</text>
  <text x="26" y="254" class="band-sub">everything else, no root needed</text>
  <text x="26" y="282" class="owner">owned by the community</text>

  <g>
    <rect x="250" y="226" width="106" height="38" rx="6" fill="#F8E4A9" stroke="#D9A92B" stroke-width="1.5"/>
    <text x="303" y="250" class="chip">python</text>
    <rect x="368" y="226" width="106" height="38" rx="6" fill="#F8E4A9" stroke="#D9A92B" stroke-width="1.5"/>
    <text x="421" y="250" class="chip">numpy</text>
    <rect x="486" y="226" width="106" height="38" rx="6" fill="#F8E4A9" stroke="#D9A92B" stroke-width="1.5"/>
    <text x="539" y="250" class="chip">hdf5</text>
    <rect x="604" y="226" width="106" height="38" rx="6" fill="#F8E4A9" stroke="#D9A92B" stroke-width="1.5"/>
    <text x="657" y="250" class="chip">pytango</text>
    <rect x="722" y="226" width="106" height="38" rx="6" fill="#F8E4A9" stroke="#D9A92B" stroke-width="1.5"/>
    <text x="775" y="250" class="chip">epics-base</text>
    <rect x="840" y="226" width="106" height="38" rx="6" fill="#F8E4A9" stroke="#D9A92B" stroke-width="1.5"/>
    <text x="893" y="250" class="chip">compilers</text>
    <rect x="958" y="226" width="110" height="38" rx="6" fill="#FFFFFF" stroke="#D9A92B" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="1013" y="250" class="chip" font-size="13">33,000+ more</text>
  </g>

  <!-- boundary note -->
  <text x="250" y="326" class="note">Built against an old glibc baseline, so it only needs the kernel, drivers and glibc from the OS</text>

  <!-- ============ System package manager ============ -->
  <rect x="2" y="340" width="1096" height="110" rx="12" fill="#F6F4FA" stroke="#B9B3C9" stroke-width="2"/>
  <text x="26" y="382" class="band-title">System</text>
  <text x="26" y="404" class="band-sub">apt, dnf, Homebrew, …</text>
  <text x="26" y="432" class="owner">owned by facility IT</text>

  <g>
    <rect x="250" y="376" width="106" height="38" rx="6" fill="#FFFFFF" stroke="#B9B3C9" stroke-width="1.5"/>
    <text x="303" y="400" class="chip-sys">kernel</text>
    <rect x="368" y="376" width="106" height="38" rx="6" fill="#FFFFFF" stroke="#B9B3C9" stroke-width="1.5"/>
    <text x="421" y="400" class="chip-sys">GPU drivers</text>
    <rect x="486" y="376" width="106" height="38" rx="6" fill="#FFFFFF" stroke="#B9B3C9" stroke-width="1.5"/>
    <text x="539" y="400" class="chip-sys">glibc</text>
    <rect x="604" y="376" width="106" height="38" rx="6" fill="#FFFFFF" stroke="#B9B3C9" stroke-width="1.5"/>
    <text x="657" y="400" class="chip-sys">FUSE</text>
    <rect x="722" y="376" width="106" height="38" rx="6" fill="#FFFFFF" stroke="#B9B3C9" stroke-width="1.5"/>
    <text x="775" y="400" class="chip-sys">CVMFS client</text>
    <rect x="840" y="376" width="106" height="38" rx="6" fill="#FFFFFF" stroke="#B9B3C9" stroke-width="1.5"/>
    <text x="893" y="400" class="chip-sys">GPFS mounts</text>
  </g>

  <!-- caption -->
  <text x="550" y="486" class="caption">The OS provides what touches hardware, conda-forge provides the rest, and Pixi pins a slice of it for each workspace.</text>
</svg>
