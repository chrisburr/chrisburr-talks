<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">RattlerVFS using libcvmfs to talk to the CVMFS CDN directly</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Lato:wght@400;700&amp;display=swap");
svg { font-family: Lato, "Fira Sans", "Segoe UI", Helvetica, sans-serif; }
text { fill: #441a84 }
.box     { fill: #ffffff; stroke: #441a84; stroke-width: 2 }
.boxr    { fill: #f9f6ff; stroke: #441a84; stroke-width: 2 }
.boxv    { fill: #ffffff; stroke: #441a84; stroke-width: 2; stroke-dasharray: 8 6 }
.title   { font-size: 18px; font-weight: 700 }
.sub     { font-size: 12.5px; fill: #6d727f }
.chip    { fill: #f7e4a8; stroke: #d2a62a; stroke-width: 1.5 }
.chipv   { fill: none; stroke: #b9a7d6; stroke-width: 1.5; stroke-dasharray: 5 5 }
.chipt   { font-size: 15px; text-anchor: middle }
.chiptv  { font-size: 15px; fill: #8a76b4; text-anchor: middle }
.chipsv  { font-size: 11px; fill: #8a76b4; text-anchor: middle }
.flow    { font-size: 15px; font-weight: 700; text-anchor: middle }
.cap     { font-size: 16.5px; fill: #6d727f; text-anchor: middle }
.arrow   { fill: none; stroke: #441a84; stroke-width: 2.5; stroke-dasharray: 7 5; stroke-linecap: round }
.bar     { fill: #441a84 }
.inner   { fill: #6c46a8; stroke: #cdbce8; stroke-width: 1.5 }
.barT    { font-size: 21px; font-weight: 700; fill: #ffffff; text-anchor: middle }
.barS    { font-size: 12px; fill: #cdbce8; text-anchor: middle }
.innerT  { font-size: 15px; font-weight: 700; fill: #ffffff; text-anchor: middle }
</style>

<defs>
  <marker id="head" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#441a84"/>
  </marker>
</defs>

<!-- CVMFS CDN, off this machine -->
<rect class="boxr" x="30" y="55" width="250" height="210" rx="10"/>
<text class="title" x="48" y="92">CVMFS CDN</text>
<text class="sub"   x="48" y="112">over HTTP, nothing mounted</text>
<rect class="chip" x="48" y="128" width="214" height="38" rx="6"/><text class="chipt" x="155" y="153">python</text>
<rect class="chip" x="48" y="170" width="214" height="38" rx="6"/><text class="chipt" x="155" y="195">numpy</text>
<rect class="chip" x="48" y="212" width="214" height="38" rx="6"/><text class="chipt" x="155" y="237">hdf5</text>

<!-- local cache -->
<rect class="box" x="30" y="285" width="250" height="72" rx="10"/>
<text class="title" x="48" y="310" font-size="16">Local cache</text>
<rect class="chip" x="48" y="318" width="214" height="32" rx="6" stroke="#441a84" stroke-width="2"/>
<text class="chipt" x="155" y="340" font-size="14">silx, your build</text>

<!-- rattlervfs with libcvmfs inside -->
<text class="flow" x="390" y="38">straight to the CDN</text>
<path class="arrow" marker-end="url(#head)" d="M 288 160 C 320 160, 320 112, 346 112"/>
<path class="arrow" marker-end="url(#head)" d="M 288 321 C 318 321, 318 300, 344 300"/>
<rect class="bar" x="350" y="55" width="80" height="302" rx="10"/>
<rect class="inner" x="358" y="64" width="64" height="96" rx="6"/>
<g transform="translate(390,112) rotate(-90)"><text class="innerT" x="0" y="5">libcvmfs</text></g>
<g transform="translate(390,258) rotate(-90)">
  <text class="barT" x="0" y="-6">RattlerVFS</text>
  <text class="barS" x="0" y="15">layered, read only</text>
</g>
<path class="arrow" marker-end="url(#head)" d="M 436 200 C 452 200, 452 96, 470 96"/>
<path class="arrow" marker-end="url(#head)" d="M 436 206 L 470 206"/>
<path class="arrow" marker-end="url(#head)" d="M 436 212 C 452 212, 452 316, 470 316"/>

<!-- environment A -->
<rect class="boxv" x="480" y="55" width="700" height="82" rx="10"/>
<text class="title" x="498" y="90">Environment A</text>
<text class="sub"   x="498" y="111">a mountpoint</text>
<rect class="chipv" x="660"  y="74" width="150" height="44" rx="6"/><text class="chiptv" x="735"  y="102">python</text>
<rect class="chipv" x="835"  y="74" width="150" height="44" rx="6"/><text class="chiptv" x="910"  y="102">numpy</text>
<rect class="chipv" x="1010" y="74" width="150" height="44" rx="6"/><text class="chiptv" x="1085" y="102">hdf5</text>

<!-- environment B -->
<rect class="boxv" x="480" y="165" width="700" height="82" rx="10"/>
<text class="title" x="498" y="200">Environment B</text>
<text class="sub"   x="498" y="221">a mountpoint</text>
<rect class="chipv" x="660"  y="184" width="150" height="44" rx="6"/><text class="chiptv" x="735"  y="212">python</text>
<rect class="chipv" x="835"  y="184" width="150" height="44" rx="6"/><text class="chiptv" x="910"  y="212">numpy</text>
<rect class="chipv" x="1010" y="184" width="150" height="44" rx="6"/><text class="chiptv" x="1085" y="212">hdf5</text>

<!-- environment C -->
<rect class="boxv" x="480" y="275" width="700" height="82" rx="10"/>
<text class="title" x="498" y="310">Environment C</text>
<text class="sub"   x="498" y="331">a mountpoint</text>
<rect class="chipv" x="660"  y="294" width="118" height="44" rx="6"/><text class="chiptv" x="719"  y="322">python</text>
<rect class="chipv" x="787"  y="294" width="118" height="44" rx="6"/><text class="chiptv" x="846"  y="322">numpy</text>
<rect class="chipv" x="914"  y="294" width="118" height="44" rx="6"/><text class="chiptv" x="973"  y="322">hdf5</text>
<rect class="chipv" x="1041" y="294" width="118" height="44" rx="6" stroke="#441a84"/>
<text class="chiptv" x="1100" y="316" fill="#441a84">silx</text><text class="chipsv" x="1100" y="331">your build</text>

<text class="cap" x="600" y="400">One layer fewer: no FUSE mount to operate, and no client-side cache holding a second copy of everything.</text>
</svg>
